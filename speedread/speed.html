<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed-Reading WPM Test</title>
    <link rel="stylesheet" href="style.css" />
    
</head>
<body>
    Speed-Reading test 
    <a href="index.html"><button>back</button></a>
    <br />

    <button id="start">
        Start
    </button>
    <select id="reading">
        <option value="1">#1 (science)</option>
        <option value="2">#2 (linguistics)</option>
        <option value="3">#3 (math)</option>
    </select>
    <input id="wpmslider" type="range" min="150" max="900" value="300" class="slider">

    <span id="wpmdisplay">
        <span id="wpmnum">300 WPM</span> 
        <span id="framenum">(12f/word)</span>
    </span>

    <div id="word">
        &MediumSpace;
    </div>

    <div class="sidenote">
        <!-- The topic is not mentioned here to ensure the above text is read entirely blind. -->
        Text taken from three wikipedia pages: <a href="https://en.wikipedia.org/wiki/Opal">#1</a>,
        <a href="https://en.wikipedia.org/wiki/Pronunciation_of_GIF">#2</a>,
        <a href="https://en.wikipedia.org/wiki/Euclidean_algorithm">#3</a>.
    </div>

    <script type="module" src="speed.js"></script>
</body>
</html>
